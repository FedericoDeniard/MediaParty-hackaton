<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor de gráficos</title>
<style>
  /* ESTILO (se cambia desde acá): superficies suaves, esquinas redondeadas, marcas sin trazo. */
  :root {
    --bg: #f2f0eb;
    --surface: #faf9f6;
    --surface-contrast: #e9e7df;
    --ink: #171717;
    --ink-soft: #5b5a55;
    --rule: #dcdad2;
    --control: #8a8880;
    --dato: #c7de58;          /* barras y relleno */
    --dato-fuerte: #9bbb22;   /* puntos y extremos */
    --dato-suave: #e6efb4;    /* resaltado de texto */
    --gris-barra: #d6d4cc;
    --gris-punto: #a3a199;
    --alerta-suave: #f1d2c4;
    --r-sm: 6px;
    --r-md: 12px;
    --r-lg: 18px;
    --r-pill: 999px;
    --font-sans: 'Archivo Variable', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-sans); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: var(--r-sm); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  a { color: var(--ink); }

  .page { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: 24px; max-width: 1280px; margin: 0 auto; padding: 24px 24px 64px; }
  header.top { grid-column: 1 / -1; padding-bottom: 16px; border-bottom: 1px solid var(--rule); }
  .eyebrow { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
  h1 { margin: 4px 0 12px; font-size: 28px; line-height: 1.15; font-weight: 700; font-stretch: 75%; letter-spacing: -.01em; }
  .picker { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .picker label { font-size: 14px; color: var(--ink-soft); }
  select { font: inherit; min-height: 44px; padding: 0 14px; background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: var(--r-pill); max-width: 100%; }
  .nav { min-height: 44px; min-width: 44px; padding: 0 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-pill); display: inline-flex; align-items: center; justify-content: center; }
  .nav:hover { background: var(--surface-contrast); }
  .origen { margin: 12px 0 0; font-size: 14px; color: var(--ink-soft); }
  .avisos { margin: 12px 0 0; padding: 0; list-style: none; font-size: 14px; }
  .avisos li { padding: 4px 0 4px 12px; border-left: 3px solid var(--dato-fuerte); border-radius: 2px; }

  main { grid-column: 1 / 8; padding-top: 24px; min-width: 0; }
  aside { grid-column: 8 / -1; padding-top: 24px; }
  .nota { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); border-radius: var(--r-lg); padding: 18px; }
  .nota h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
  .cita { margin: 0 0 16px; padding: 12px 14px; background: var(--surface-contrast); border-radius: var(--r-md); font-size: 14px; }
  .cita:empty::before { content: 'Elegí un punto, una marca o una fila para ver el pasaje de la nota que la respalda.'; color: var(--ink-soft); }
  .cita dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
  .cita dt { color: var(--ink-soft); }
  .cita dd { margin: 0; }
  .cuerpo { white-space: pre-wrap; font-size: 15px; line-height: 1.6; margin: 0; }
  mark { background: var(--dato-suave); color: var(--ink); padding: 1px 2px; border-radius: 4px; }

  section.grafico { padding: 28px 0; border-top: 1px solid var(--rule); }
  section.grafico:first-child { border-top: 0; padding-top: 0; }
  section.grafico h2 { margin: 0; font-size: 20px; line-height: 1.25; font-weight: 700; }
  .meta { margin: 6px 0 16px; font-size: 14px; color: var(--ink-soft); }
  .vacio { padding: 24px 0; color: var(--ink-soft); }
  .proto { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; background: var(--ink); color: var(--bg); padding: 2px 10px; border-radius: var(--r-pill); margin-bottom: 10px; }
  .leyenda { font-size: 13px; color: var(--ink-soft); margin: 12px 0 0; }
  .aparte { padding: 14px 16px; background: var(--surface); border-radius: var(--r-md); font-size: 15px; }
  .aparte button { text-decoration: underline; margin-left: 6px; min-height: 32px; }

  svg { width: 100%; height: auto; display: block; overflow: visible; }
  svg text { font-family: var(--font-sans); fill: var(--ink); }
  svg .tenue { fill: var(--ink-soft); }
  .marca { cursor: pointer; }
  .marca:focus-visible { outline: none; }
  .marca:focus-visible .fondo, .marca:hover .fondo { fill: var(--surface-contrast); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
  th { text-align: left; font-weight: 600; color: var(--ink-soft); padding: 6px 8px 6px 0; border-bottom: 1px solid var(--rule); }
  td { padding: 8px 8px 8px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
  td button { min-height: 36px; text-decoration: underline; }
  details.tabla { margin-top: 12px; font-size: 14px; }
  details.tabla summary { cursor: pointer; color: var(--ink-soft); min-height: 32px; }

  /* lista de filas (ranking, línea de tiempo, voces) */
  .fila { display: grid; align-items: center; width: 100%; min-height: 48px; padding: 4px 10px; margin: 2px 0; border-radius: var(--r-md); }
  .fila:hover, .activa { background: var(--surface-contrast); }
  .pista { height: 12px; border-radius: var(--r-pill); background: var(--surface-contrast); overflow: hidden; }
  .fila:hover .pista, .activa .pista { background: var(--bg); }
  .barra { display: block; height: 100%; border-radius: var(--r-pill); background: var(--dato-fuerte); }
  .barra.gris { background: var(--gris-punto); }
  .rank { grid-template-columns: 170px 1fr 36px; column-gap: 12px; }
  .rank .nombre { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank .valor, .voz-n { text-align: right; font-variant-numeric: tabular-nums; }
  .tiempo { grid-template-columns: 92px 1fr; column-gap: 12px; }
  .tiempo .fecha { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--ink-soft); }
  .tiempo .cuerpo-fila { display: grid; gap: 4px; }
  .tiempo .pista-t { position: relative; height: 10px; border-bottom: 1px solid var(--rule); }
  .tiempo .punto { position: absolute; bottom: -5px; width: 10px; height: 10px; background: var(--dato-fuerte); border-radius: 50%; transform: translateX(-50%); }
  .alerta { font-size: 12px; color: var(--ink-soft); }

  /* F1: quién habla */
  .voz { grid-template-columns: 210px 1fr 32px; column-gap: 14px; min-height: 56px; }
  .voz-et { display: grid; line-height: 1.25; }
  .voz-et b { font-size: 14px; }
  .voz-et small { font-size: 12px; color: var(--ink-soft); }
  .faltan { margin-top: 20px; padding: 14px 16px; background: var(--surface); border-radius: var(--r-md); }
  .faltan h3 { margin: 0 0 2px; font-size: 14px; }
  .faltan p { margin: 0 0 8px; font-size: 12px; color: var(--ink-soft); }
  .faltan ul { margin: 0; padding-left: 18px; font-size: 14px; }
  .faltan li { margin: 4px 0; }

  /* F2: la nota anotada */
  .anot { display: grid; grid-template-columns: 1fr 20px; gap: 10px; }
  .anot-texto { max-height: 440px; overflow: auto; padding: 16px 18px; background: var(--surface); border-radius: var(--r-md); white-space: pre-wrap; font-size: 15px; line-height: 1.75; }
  .mini { position: relative; background: var(--surface-contrast); border-radius: var(--r-pill); cursor: pointer; }
  .mini i { position: absolute; left: 4px; right: 4px; height: 4px; border-radius: 2px; background: var(--gris-punto); }
  .mini i.t-cifra { background: var(--dato-fuerte); }
  .mini i.t-ok { background: var(--ink); }
  .mini i.t-difiere { background: #d0785a; }
  .mini i.t-pendiente { background: var(--ink-soft); }
  .mini .vista { position: absolute; left: 0; right: 0; border-radius: var(--r-pill); background: rgba(23, 23, 23, .1); box-shadow: inset 0 0 0 1px rgba(23, 23, 23, .22); pointer-events: none; }
  .m-cifra { background: var(--dato-suave); border-radius: 4px; padding: 1px 2px; cursor: pointer; }
  .m-cita { text-decoration: underline; text-decoration-color: var(--ink-soft); text-decoration-thickness: 2px; text-underline-offset: 4px; text-decoration-skip-ink: none; }
  .m-ok { background: var(--dato); border-radius: 4px; padding: 1px 3px; font-weight: 600; cursor: pointer; }
  .m-difiere { background: var(--alerta-suave); border-radius: 4px; padding: 1px 3px; font-weight: 600; cursor: pointer; }
  .m-pendiente { border-bottom: 2px dotted var(--ink); border-radius: 2px; font-weight: 600; cursor: pointer; }
  .pill { display: inline-block; font-size: 11px; font-weight: 600; line-height: 18px; padding: 0 8px; margin: 0 2px 0 4px; border-radius: var(--r-pill); background: var(--ink); color: var(--bg); vertical-align: 1px; white-space: nowrap; }
  .pill.gris { background: var(--gris-barra); color: var(--ink); }
  .guia { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-soft); margin: 0 0 12px; }
  .guia span.ej { color: var(--ink); }

  .analizar { min-height: 44px; padding: 0 22px; border-radius: var(--r-pill); background: var(--ink); color: var(--bg); font-weight: 600; transition: transform .15s, background .15s; }
  .analizar:hover { background: #2b2b2b; transform: translateY(-1px); }
  .flujo { margin: 0 0 24px; padding: 18px 22px; background: var(--surface); border-radius: var(--r-lg); }
  .flujo summary { cursor: pointer; font-weight: 700; font-size: 15px; min-height: 28px; }
  .pasos { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 10px; }
  .paso { display: grid; grid-template-columns: 104px 1fr; gap: 12px; align-items: baseline; font-size: 14px; animation: paso-entra .45s cubic-bezier(.2, .8, .2, 1) both; }
  .paso .fase { justify-self: start; padding: 1px 10px; border-radius: var(--r-pill); background: var(--surface-contrast); color: var(--ink-soft); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .paso--listo .fase { background: var(--dato); color: var(--ink); }
  .paso--listo .texto { font-weight: 700; }
  .paso--error .fase { background: var(--alerta-suave); }
  .pensando { display: flex; gap: 6px; padding: 6px 0 2px 116px; }
  .pensando i { width: 8px; height: 8px; border-radius: 50%; background: var(--dato-fuerte); animation: pulso 1s ease-in-out infinite; }
  .pensando i:nth-child(2) { animation-delay: .15s; }
  .pensando i:nth-child(3) { animation-delay: .3s; }
  @keyframes paso-entra { from { opacity: 0; transform: translateY(8px); } }
  @keyframes pulso { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
  @media (prefers-reduced-motion: reduce) { .paso, .pensando i { animation: none; } }
  .acciones { display: flex; gap: 8px; align-items: center; margin: 0 0 12px; }
  .agregar { min-height: 36px; padding: 0 16px; border-radius: var(--r-pill); border: 1px solid var(--ink); font-size: 13px; font-weight: 600; transition: background .15s, transform .15s; }
  .agregar:hover { background: var(--surface-contrast); transform: translateY(-1px); }
  .agregar[aria-pressed='true'] { background: var(--dato); border-color: var(--dato-fuerte); }
  .ir-nota { min-height: 36px; padding: 0 12px; font-size: 13px; color: var(--ink-soft); text-decoration: underline; }
  #nota-extra { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--rule); display: grid; gap: 18px; }
  #nota-extra[hidden] { display: none; }
  .nota-seccion { padding: 14px; background: var(--bg); border-radius: var(--r-md); animation: paso-entra .45s cubic-bezier(.2, .8, .2, 1) both; scroll-margin-top: 12px; }
  .nota-seccion.recien { animation: resalta 1.8s ease-out; }
  .nota-seccion__cab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .nota-seccion__num { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
  .quitar { font-size: 12px; color: var(--ink-soft); text-decoration: underline; min-height: 28px; }
  .nota-seccion section.grafico { padding: 0; border: 0; }
  .nota-seccion .proto { display: none; }
  .nota .nota-seccion section.grafico h2 { margin: 0; font-size: 17px; line-height: 1.3; font-weight: 700; letter-spacing: 0; text-transform: none; color: var(--ink); }
  .nota-seccion .meta { margin: 4px 0 12px; }
  @keyframes resalta { 0% { box-shadow: 0 0 0 4px var(--dato-fuerte); } 100% { box-shadow: 0 0 0 0 transparent; } }
  @media (prefers-reduced-motion: reduce) { .nota-seccion, .nota-seccion.recien { animation: none; } }
  .motivo { margin: 0 0 14px; padding: 8px 14px; background: var(--surface); border-radius: var(--r-pill); font-size: 13px; color: var(--ink-soft); display: inline-block; }
  .fuentes { margin: 14px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--ink-soft); }
  .fuentes li { padding: 3px 0; }
  .barra-ctx { transition: opacity .2s; }
  .ctx-bar:hover .barra-ctx { opacity: .8; }

  @media (max-width: 900px) {
    .page { column-gap: 0; padding: 16px; }
    main, aside { grid-column: 1 / -1; }
    .nota { position: static; max-height: none; }
    .rank { grid-template-columns: 110px 1fr 28px; }
    .voz { grid-template-columns: 130px 1fr 28px; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <p class="eyebrow">Nexo · visor local de gráficos</p>
    <h1 id="titulo">Cargando…</h1>
    <div class="picker">
      <label for="nota-sel">Nota</label>
      <select id="nota-sel"></select>
      <button class="nav" id="ant" aria-label="Nota anterior">←</button>
      <button class="nav" id="sig" aria-label="Nota siguiente">→</button>
      <button class="analizar" id="analizar">Analizar esta nota</button>
    </div>
    <p class="origen" id="origen"></p>
    <ul class="avisos" id="avisos"></ul>
  </header>
  <main id="graficos" aria-live="polite"></main>
  <aside>
    <div class="nota" id="nota">
      <h2>Cita seleccionada</h2>
      <div class="cita" id="cita"></div>
      <h2>Nota</h2>
      <p class="cuerpo" id="cuerpo"></p>
      <div id="nota-extra" hidden></div>
    </div>
  </aside>
</div>

<script>
const fmt = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 2 });
const NS = 'http://www.w3.org/2000/svg';
let notas = [];
let actual = null;

function h(tag, props = {}, ...hijos) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const hijo of hijos.flat()) if (hijo != null && hijo !== false) el.append(hijo.nodeType ? hijo : document.createTextNode(String(hijo)));
  return el;
}
function s(tag, props = {}, ...hijos) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(props)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v != null) el.setAttribute(k, v);
  }
  for (const hijo of hijos.flat()) if (hijo != null) el.append(hijo.nodeType ? hijo : document.createTextNode(String(hijo)));
  return el;
}
const mes = (x) => x.slice(0, 7);
const urlSegura = (u) => typeof u === 'string' && /^https?:\/\//.test(u);
const nombreMes = (p) => new Date(p.length === 7 ? p + '-01' : p).toLocaleDateString('es-AR', { month: 'long', year: 'numeric', timeZone: 'UTC' });
const mesCorto = (f) => new Date(f).toLocaleDateString('es-AR', { month: 'short', year: 'numeric', timeZone: 'UTC' });
const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;

/* ---- selección: muestra el pasaje y lo resalta en la nota ---- */
function seleccionar(detalle, cita, origenEl) {
  document.querySelectorAll('.activa').forEach((e) => e.classList.remove('activa'));
  if (origenEl && origenEl.classList) origenEl.classList.add('activa');
  const caja = document.getElementById('cita');
  caja.replaceChildren();
  const dl = h('dl');
  for (const [k, v] of detalle) {
    if (v == null || v === '') continue;
    dl.append(h('dt', {}, k), h('dd', {}, v));
  }
  caja.append(dl);
  const cuerpo = document.getElementById('cuerpo');
  const texto = actual.cuerpo;
  if (!cita) { cuerpo.textContent = texto; return; }
  const marca = h('mark', {}, texto.slice(cita.inicio, cita.fin));
  cuerpo.replaceChildren(texto.slice(0, cita.inicio), marca, texto.slice(cita.fin));
  marca.scrollIntoView({ block: 'center' });
  if (matchMedia('(max-width: 900px)').matches) document.getElementById('nota').scrollIntoView();
}
function detalleDeCita(cita) {
  return cita ? [['Párrafo', cita.parrafo_id], ['Pasaje', '“' + cita.cita + '”']] : [['Pasaje', 'sin cita']];
}
function conTeclado(nodo, accion) {
  nodo.addEventListener('click', accion);
  nodo.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); accion(); } });
}

/* ---- serie oficial con la cifra de la nota marcada ---- */
function paso(maximo) {
  const bruto = maximo / 4, pot = 10 ** Math.floor(Math.log10(bruto));
  return [1, 2, 2.5, 5, 10].map((m) => m * pot).find((p) => p >= bruto);
}
function dibujarSerie(g) {
  const W = 640, H = 290, L = 44, R = 20, T = 34, B = 40;
  const pts = g.puntos;
  const valores = pts.map((p) => p.y).filter((v) => v != null).concat(g.marcas.map((m) => m.y));
  const p = paso(Math.max(...valores, 1) * 1.1), tope = p * 4;
  const X = (i) => L + (W - L - R) * (pts.length === 1 ? 0.5 : i / (pts.length - 1));
  const Y = (v) => T + (H - T - B) * (1 - v / tope);
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `Serie ${g.titulo}` });
  for (let k = 0; k <= 4; k++) {
    const y = Y(k * p);
    svg.append(
      s('line', { x1: L, x2: W - R, y1: y, y2: y, style: 'stroke:var(--rule)', 'stroke-width': 1 }),
      s('text', { x: L - 8, y: y + 4, 'text-anchor': 'end', 'font-size': 11, class: 'tenue' }, fmt.format(k * p)),
    );
  }
  const cada = Math.ceil(pts.length / 12);
  pts.forEach((pt, i) => {
    if (i % cada === 0) svg.append(s('text', { x: X(i), y: H - B + 18, 'text-anchor': 'middle', 'font-size': 11, class: 'tenue' }, mes(pt.x)));
  });
  let tramo = [];
  const cerrar = () => { if (tramo.length > 1) svg.append(s('polyline', { points: tramo.join(' '), fill: 'none', style: 'stroke:var(--ink)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' })); tramo = []; };
  pts.forEach((pt, i) => { if (pt.y == null) cerrar(); else tramo.push(`${X(i)},${Y(pt.y)}`); });
  cerrar();
  pts.forEach((pt, i) => { if (pt.y != null) svg.append(s('circle', { cx: X(i), cy: Y(pt.y), r: 3.5, style: 'fill:var(--ink)' })); });
  g.marcas.forEach((m, k) => {
    const i = pts.findIndex((pt) => pt.x === m.x);
    if (i < 0) return;
    const hueco = m.resultado === 'sin_dato_oficial';
    const ultimo = i === pts.length - 1;
    const cx = X(i), cy = Y(m.y);
    const etiqueta = hueco ? `nota ${fmt.format(m.y)} · sin dato oficial` : m.resultado === 'difiere' ? `nota ${fmt.format(m.y)} · serie ${fmt.format(m.valor_serie)}` : fmt.format(m.y);
    const nodo = s('g', { class: 'marca', tabindex: 0, role: 'button', 'aria-label': `${etiqueta}, ${mes(m.x)}. Ver la cita en la nota` },
      s('circle', { cx, cy, r: 9, style: hueco ? 'fill:none;stroke:var(--ink-soft);stroke-dasharray:3 3' : 'fill:var(--dato-fuerte);stroke:var(--bg)', 'stroke-width': hueco ? 1.5 : 3 }),
      s('text', { x: ultimo ? cx + 8 : cx, y: cy - 16 - 13 * k, 'text-anchor': ultimo ? 'end' : 'middle', 'font-size': 12, 'font-weight': 600 }, etiqueta),
    );
    conTeclado(nodo, () => seleccionar(detalleDeMarca(m), m.cita, nodo));
    svg.append(nodo);
  });
  return svg;
}
function detalleDeMarca(m) {
  return [
    ['Dice la nota', m.texto],
    ['Resultado', m.resultado.replaceAll('_', ' ')],
    ['Valor de la nota', fmt.format(m.y)],
    ['Valor de la serie', m.valor_serie == null ? 'sin dato oficial' : fmt.format(m.valor_serie)],
    ...(m.advertencias.length ? [['Advertencias', m.advertencias.join(' · ')]] : []),
    ...detalleDeCita(m.cita),
  ];
}
function tablaDeMarcas(g) {
  const cuerpo = h('tbody');
  g.marcas.forEach((m) => {

    const principal = cubren.find((m) => m.tipo !== 'cita') || cubren[0];

  const filas = g.visual === 'barras'
    ? g.barras.map((b) => [b.etiqueta, fmt.format(Math.round(b.valor * 100) / 100), ''])
    : g.series.map((s2) => [NOMBRES_CORTOS[s2.clave] || s2.nombre, `${fmt.format(Math.round(s2.puntos[0].y * 100) / 100)} (${mes(s2.puntos[0].x)})`, `${fmt.format(Math.round(s2.puntos[s2.puntos.length - 1].y * 100) / 100)} (${mes(s2.puntos[s2.puntos.length - 1].x)})`]);
  const cab = g.visual === 'barras' ? ['Período', 'Valor', ''] : ['Serie', 'Primer mes', 'Último mes'];
  return h('details', { class: 'tabla' }, h('summary', {}, 'Ver como tabla'),
    h('table', {}, h('thead', {}, h('tr', {}, cab.map((t) => h('th', {}, t)))), h('tbody', {}, filas.map((f) => h('tr', {}, f.map((c) => h('td', {}, c)))))));
}
function seccionContexto(g) {
  const fuentes = h('ul', { class: 'fuentes' }, g.fuentes.map((f) => h('li', {},
    h('a', { href: f.enlace, rel: 'noopener noreferrer', target: '_blank' }, f.nombre), ` · ${f.institucion} · último dato ${f.ultimo_dato}`,
    f.rezago_meses ? ` (hace ${plural(f.rezago_meses, 'mes', 'meses')})` : '', f.origen_datos === 'guardado' ? ' · copia guardada' : '')));
  return seccionProto('Contexto · datos oficiales', g.titulo, g.unidad,
    [g.motivos.length ? h('p', { class: 'motivo' }, 'Te lo sugerimos porque la nota menciona: ' + g.motivos.join(', ')) : null,
      g.visual === 'barras' ? dibujarContextoBarras(g) : dibujarContextoLineas(g), tablaContexto(g), fuentes,
      g.advertencias.length ? h('ul', { class: 'avisos' }, g.advertencias.map((a) => h('li', {}, a))) : null],
    'Cómo leerlo: ' + g.como_leerlo, 'ctx-' + g.id);
}

function seccionProto(etiqueta, titulo, meta, contenido, pie, id = null) {
  return h('section', { class: 'grafico', 'data-id': id ?? 'proto-' + etiqueta[0] + (etiqueta[1] === '1' || etiqueta[1] === '2' ? etiqueta[1] : '') },
    h('span', { class: 'proto' }, 'Prototipo ' + etiqueta), h('h2', {}, titulo), meta ? h('p', { class: 'meta' }, meta) : null, contenido,
    pie ? h('p', { class: 'leyenda' }, pie) : null);
}
function seccionesProto(p, contextos = []) {
  const secciones = p.proyecciones.map(seccionA);
  if (!secciones.length) {
    secciones.push(seccionProto('A · Proyecciones', 'No hay proyecciones por fuente para comparar', 'Lo que proyecta cada fuente contra el último dato oficial',
      h('p', { class: 'aparte' }, 'El sistema no detectó en esta nota proyecciones para un período sin dato oficial.'),
      'Busca cifras en % de un indicador del catálogo, para un período que todavía no tiene dato oficial.'));
  }
  secciones.push(...contextos.map(seccionContexto), seccionF1(p.voces), seccionF2(p.anotada));
  return secciones;
}

/* ---- página ---- */
function seccion(g) {
  const meta = [
    g.tipo === 'serie' ? 'Serie oficial verificada' : g.tipo === 'linea_tiempo' ? 'Eventos que la nota sostiene' : 'Entidades verificadas en la nota',
    g.fuente ? `fuente: ${g.fuente}` : null,
    g.origen_datos === 'guardado' ? 'copia guardada' : g.origen_datos === 'api' ? 'API en vivo' : null,
  ].filter(Boolean).join(' · ');
  const nodo = h('section', { class: 'grafico', 'data-id': g.id },
    h('h2', {}, g.titulo),
    h('p', { class: 'meta' }, meta, urlSegura(g.enlace) ? [' · ', h('a', { href: g.enlace, rel: 'noopener noreferrer', target: '_blank' }, 'ver la serie')] : null),
  );
  if (g.tipo === 'serie') nodo.append(dibujarSerie(g), tablaDeMarcas(g));
  else if (g.tipo === 'linea_tiempo') nodo.append(dibujarTiempo(g));
  else nodo.append(dibujarRanking(g));
  if (g.avisos.length) nodo.append(h('ul', { class: 'avisos' }, g.avisos.map((a) => h('li', {}, a))));
  return nodo;
}

/* ---- agregar un gráfico a la nota: aparece como una sección nueva dentro de la nota ---- */
const agregadas = new Map(); // data-id del gráfico -> { titulo }
const sinAnimacion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function refrescarAcciones() {
  const extra = document.getElementById('nota-extra');
  document.querySelectorAll('#graficos section.grafico').forEach((sec) => {
    const id = sec.dataset.id;
    const puesto = agregadas.has(id);
    const boton = sec.querySelector('.agregar');
    if (!boton) return;
    boton.setAttribute('aria-pressed', String(puesto));
    boton.textContent = puesto ? '✓ Agregado a la nota' : 'Agregar a la nota';
    sec.querySelector('.ir-nota').hidden = !puesto;
  });
  extra.hidden = agregadas.size === 0;
}
function numerarSecciones() {
  [...document.querySelectorAll('#nota-extra .nota-seccion')].forEach((el, i) => {
    el.querySelector('.nota-seccion__num').textContent = `Sección ${i + 1}`;
  });
}
function irASeccion(id) {
  const destino = document.getElementById(`nota-sec-${id}`);
  if (!destino) return;
  destino.scrollIntoView({ block: 'start', behavior: sinAnimacion ? 'auto' : 'smooth' });
  destino.classList.remove('recien');
  void destino.offsetWidth; // reinicia la animación de resaltado
  destino.classList.add('recien');
}
function agregarALaNota(sec, id, titulo) {
  const copia = sec.cloneNode(true);
  copia.querySelectorAll('.acciones, details.tabla').forEach((e) => e.remove());
  const quitar = h('button', { class: 'quitar', type: 'button', onclick: () => quitarDeLaNota(id) }, 'Quitar de la nota');
  const nodo = h('article', { class: 'nota-seccion', id: `nota-sec-${id}` },
    h('div', { class: 'nota-seccion__cab' }, h('span', { class: 'nota-seccion__num' }), quitar), copia);
  document.getElementById('nota-extra').append(nodo);
  agregadas.set(id, { titulo });
  numerarSecciones();
  refrescarAcciones();
  irASeccion(id);
}
function quitarDeLaNota(id) {
  document.getElementById(`nota-sec-${id}`)?.remove();
  agregadas.delete(id);
  numerarSecciones();
  refrescarAcciones();
}
function prepararSeccion(sec) {
  const id = sec.dataset.id;
  const titulo = sec.querySelector('h2')?.textContent ?? id;
  const boton = h('button', { class: 'agregar', type: 'button', 'aria-pressed': 'false' }, 'Agregar a la nota');
  const ver = h('button', { class: 'ir-nota', type: 'button', hidden: '' }, 'Ver en la nota →');
  boton.addEventListener('click', () => (agregadas.has(id) ? quitarDeLaNota(id) : agregarALaNota(sec, id, titulo)));
  ver.addEventListener('click', () => irASeccion(id));
  sec.insertBefore(h('div', { class: 'acciones' }, boton, ver), sec.firstChild);
}

/* Pinta una nota ya analizada. `previa` (la tarjeta del recorrido) queda arriba de los gráficos. */
function pintar(datos, previa = null) {
  actual = datos;
  document.getElementById('titulo').textContent = actual.titulo;
  document.title = `${actual.n} · ${actual.titulo}`;
  document.getElementById('origen').textContent =
    `${actual.niche} · cuerpo: corpus/notas/md · enriquecimientos: ${actual.origen} (salida real del backend) · gráficos: calculados por el motor al abrir esta nota`;
  document.getElementById('avisos').replaceChildren(...actual.avisos.map((a) => h('li', {}, a)));
  agregadas.clear();
  document.getElementById('nota-extra').replaceChildren();
  const secciones = [
    ...seccionesProto(actual.prototipos, actual.contextos),
    ...(actual.graficos.length ? actual.graficos.map(seccion) : [h('p', { class: 'vacio' }, 'El sistema no armó ningún gráfico para esta nota.')]),
  ];
  // Solo los que dibujan algo se pueden agregar a la nota (no las frases de "no hay para comparar").
  secciones.filter((x) => x.matches('section.grafico') && x.querySelector('svg, .fila, .anot')).forEach(prepararSeccion);
  document.getElementById('graficos').replaceChildren(...(previa ? [previa] : []), ...secciones);
  refrescarAcciones();
  document.getElementById('cita').replaceChildren();
  document.getElementById('cuerpo').textContent = actual.cuerpo;
  document.getElementById('nota-sel').value = actual.n;
  history.replaceState(null, '', `#${actual.n}`);
}
async function cargar(n) {
  cerrarFlujo();
  const r = await fetch(`/api/notas/${n}`);
  if (!r.ok) throw new Error(`Error ${r.status}`);
  pintar(await r.json());
}

/* ---- el recorrido en vivo: cada paso sale de un resultado real del motor para esta nota ---- */
const FASES = { leer: 'Lectura', agentes: 'Agentes', verificar: 'Verificación', cifras: 'Cifras', contexto: 'Contexto', armar: 'Armado', listo: 'Listo' };
let fuenteDelFlujo = null;
function cerrarFlujo() { if (fuenteDelFlujo) { fuenteDelFlujo.close(); fuenteDelFlujo = null; } }
const itemDePaso = (m) => h('li', { class: `paso paso--${m.fase}` }, h('span', { class: 'fase' }, FASES[m.fase] || m.fase), h('span', { class: 'texto' }, m.texto));

function analizar(n) {
  cerrarFlujo();
  const lista = h('ol', { class: 'pasos' });
  const pensando = h('li', { class: 'pensando', 'aria-label': 'El motor está trabajando' }, h('i'), h('i'), h('i'));
  const resumen = h('summary', {}, 'Así piensa el motor sobre esta nota…');
  const tarjeta = h('details', { class: 'flujo', open: '' }, resumen, lista);
  lista.append(pensando);
  document.getElementById('graficos').replaceChildren(tarjeta);
  document.getElementById('cita').replaceChildren();
  let pasos = 0;
  const fuente = new EventSource(`/api/notas/${n}/flujo`);
  fuenteDelFlujo = fuente;
  fuente.onmessage = (e) => {
    const m = JSON.parse(e.data);
    pasos += 1;
    if (m.fase !== 'listo') { pensando.before(itemDePaso(m)); return; }
    cerrarFlujo();
    pensando.remove();
    lista.append(itemDePaso(m));
    resumen.textContent = `Así pensó el motor · ${pasos} pasos`;
    pintar(m.nota, tarjeta);
    setTimeout(() => tarjeta.removeAttribute('open'), 2200);
  };
  fuente.onerror = () => {
    cerrarFlujo();
    pensando.remove();
    lista.append(h('li', { class: 'paso paso--error' }, h('span', { class: 'fase' }, 'Error'), h('span', { class: 'texto' }, 'Se cortó la conexión con el motor.')));
  };
}
function ir(delta) {
  const i = notas.findIndex((x) => x.n === actual.n) + delta;
  if (i >= 0 && i < notas.length) cargar(notas[i].n);
}

(async () => {
  notas = await (await fetch('/api/notas')).json();
  const sel = document.getElementById('nota-sel');
  sel.append(...notas.map((x) => h('option', { value: x.n }, `${x.n} · ${x.titulo.slice(0, 70)}`)));
  sel.addEventListener('change', () => cargar(sel.value));
  document.getElementById('ant').addEventListener('click', () => ir(-1));
  document.getElementById('sig').addEventListener('click', () => ir(1));
  document.getElementById('analizar').addEventListener('click', () => analizar(actual.n));
  const inicial = notas.some((x) => x.n === location.hash.slice(1)) ? location.hash.slice(1) : notas[0].n;
  cargar(inicial);
})().catch((e) => { document.getElementById('titulo').textContent = 'No se pudo cargar: ' + e.message; });
</script>
