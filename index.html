<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#F2F0EB" />
<title>MediaParty · Hackaton</title>
<style>
  :root {
    --bone: #f2f0eb;
    --bone-raised: #faf9f6;
    --ink: #171717;
    --ink-soft: #5b5a55;
    --rule: #c9c7c0;
    --control: #6a6862;
    --font-sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bone);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: min(680px, 100%);
    background: var(--bone-raised);
    border: 1px solid var(--ink);
    padding: 40px;
  }

  .label {
    display: inline-block;
    border: 1px solid var(--ink);
    padding: 4px 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  h1 {
    margin: 24px 0 8px;
    font-size: clamp(44px, 8vw, 96px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 0.92;
    text-transform: uppercase;
  }

  p {
    margin: 0 0 24px;
    font-size: 18px;
    color: var(--ink-soft);
  }

  .link {
    display: inline-block;
    border: 1px solid var(--ink);
    padding: 12px 20px;
    color: var(--ink);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-decoration: none;
    text-transform: uppercase;
    word-break: break-all;
    transition: background-color 120ms cubic-bezier(0.2, 0, 0, 1), color 120ms cubic-bezier(0.2, 0, 0, 1);
  }

  .link:hover { background: var(--ink); color: var(--bone); }
  .link:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  footer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce) {
    .link { transition: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <span class="label">Hackaton</span>
    <h1>MediaParty</h1>
    <p>El repo del proyecto está en GitHub. Entrá, clonalo y arrancá.</p>

    <a class="link" href="https://github.com/FedericoDeniard/MediaParty-hackaton" target="_blank" rel="noopener noreferrer">
      github.com/FedericoDeniard/MediaParty-hackaton
    </a>

    <footer>Served on the local network</footer>
  </main>
</body>
</html>
